name: TWIGA Website CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/website-ci.yml"

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website JavaScript syntax
        run: |
          node --check web/script.js
          node --check web/api/latest-apk.js
      - name: Install website dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Build Vite website
        run: npm run build --prefix web
